{{/* Changelog entry tile. Params: page, latest (bool) */}}
{{ $p := .page }}
<a href="{{ $p.RelPermalink }}" class="list-tile">
    <span class="list-tile-body">
        <span class="d-flex flex-wrap align-items-center gap-2 mb-1">
            <span class="list-tile-title mb-0">{{ $p.Title }}</span>
            {{ if .latest }}<span class="variant-size">Latest</span>{{ end }}
        </span>
        <span class="list-tile-meta">
            <i class="bi bi-calendar3" aria-hidden="true"></i>
            <time datetime='{{ $p.Date.Format "2006-01-02" }}'>{{ $p.Date.Format "January 2, 2006" }}</time>
        </span>
        <span class="list-tile-desc">{{ $p.Summary | plainify | truncate 140 }}</span>
    </span>
    <i class="bi bi-chevron-right list-tile-arrow" aria-hidden="true"></i>
</a>
