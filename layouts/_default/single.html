{{ define "main" }}
{{ if .Params.nocard }}
{{/* Page content provides its own cards — skip the wrapper card to avoid nested (double) borders. */}}
<h1 class="display-5 fw-bold text-center mb-0" style="color: var(--md-sys-color-primary);">
    {{ .Title }}
</h1>
{{ .Content }}
{{ else }}
<div class="row justify-content-center">
    <div class="col-lg-10 col-xl-9">
        
        <article class="md3-card p-4 p-md-5 border-0 shadow-sm" style="border-top: 4px solid var(--md-sys-color-primary) !important;">
            {{ partial "single.html" . }}
        </article>

    </div>
</div>
{{ end }}
{{ end }}
