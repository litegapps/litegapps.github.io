# Single source of truth for LiteGapps variants.
# Used by the home page (layouts/index.html) and the variant doc page (shortcode `variants`).

- name: "Pixel"
  size: "1.2 GB"
  summary: "Includes all Google Apps from the latest Pixel devices. Not recommended for devices with limited storage or RAM."
  description: "LiteGapps Pixel is a complete package of Google apps ported directly from Google Pixel. You will get Google Apps on Google Pixel and their features, but they are large in size."
  groups:
    - title: "Core Packages"
      apps: ["Android Migrate", "Carrier Services", "Carrier Setup", "Common", "Config Updater", "Google Play Services", "Google Backup Transport", "Google Calendar Sync Adapter", "Google Contacts Sync Adapter", "Google ExtServices", "Google ExtShared", "Google Feedback", "Google One Time Initializer", "Google Partner Setup", "Google Restore", "Google Services Framework", "Google Play Store", "Setup Wizard"]
    - title: "Gapps Packages"
      apps: ["Android Auto", "Arcore", "Chrome", "Desk Clock Google", "Device Policy", "Dream Liner", "Drive", "Files", "Gmail", "Google Assistant", "Google Calculator", "Google Calendar", "Google Contacts", "Google Dialer", "Google Keyboard", "Google Pixel Wallpaper", "Google TTS", "Google Vr Core", "Google Web View", "Keep", "Location History", "Maps", "Markup Google", "Messaging", "Photos", "Pixel Launcher", "Pixel Live Wallpaper", "Play Games", "Recorder", "Sound Picker", "Sribe", "Talkback", "Turbo", "Tycho", "Google Search", "Videos", "Wallpaper Picker", "Wellbeing", "Youtube", "Youtube Music"]

