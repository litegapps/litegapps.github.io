- name: "Core"
  size: "74.0 MB"
  summary: "A minimal package with only the core Google components. One of our most popular variants."
  description: "LiteGapps Core is a package that contains the core package of google apps."
  groups:
    - title: "Core Packages"
      apps: ["Android Migrate", "Carrier Services", "Carrier Setup", "Common", "Config Updater", "Google Play Services", "Google Backup Transport", "Google Calendar Sync Adapter", "Google Contacts Sync Adapter", "Google ExtServices", "Google ExtShared", "Google Feedback", "Google One Time Initializer", "Google Partner Setup", "Google Restore", "Google Services Framework", "Playstore", "Setup Wizard"]

- name: "Lite"
